name: APK Android

on:
  push:
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Construir APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: bash android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ChispaSalvaje-apk
          path: ChispaSalvaje.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-1.0.${{ github.run_number }}"
          gh release create "$TAG" ChispaSalvaje.apk \
            --target "${{ github.sha }}" \
            --title "Chispa Salvaje 1.0.${{ github.run_number }}" \
            --notes "APK para Android (tablet y móvil). Descarga ChispaSalvaje.apk desde la tablet, ábrelo y permite instalar apps de esta fuente. Las partidas guardadas se conservan al actualizar."
